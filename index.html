  <script>
    // 音效管理模組（使用 Tone.js 程式合成，無外部依賴）
    let soundEnabled = true;
    let synth = null;
    let noiseSynth = null;

    function initAudio() {
      if (!synth && window.Tone) {
        try {
          synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: 'triangle' },
            envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.4 }
          }).toDestination();
          synth.volume.value = -8;

          noiseSynth = new Tone.MembraneSynth().toDestination();
          noiseSynth.volume.value = -6;
        } catch (e) {
          console.warn("音訊初始化略過", e);
        }
      }
    }

    function playPullSound() {
      if (!soundEnabled) return;
      initAudio();
      try {
        if (noiseSynth) noiseSynth.triggerAttackRelease("C2", "8n");
      } catch (e) {}
    }

    function playCorrectSound() {
      if (!soundEnabled) return;
      initAudio();
      try {
        if (synth) {
          synth.triggerAttackRelease(["E5", "G5", "C6"], "16n");
        }
      } catch (e) {}
    }

    function playWrongSound() {
      if (!soundEnabled) return;
      initAudio();
      try {
        if (synth) {
          synth.triggerAttackRelease(["C3", "F#3"], "8n");
        }
      } catch (e) {}
    }

    function playVictoryFanfare() {
      if (!soundEnabled) return;
      initAudio();
      try {
        if (synth) {
          const now = Tone.now();
          synth.triggerAttackRelease("C5", "8n", now);
          synth.triggerAttackRelease("E5", "8n", now + 0.15);
          synth.triggerAttackRelease("G5", "8n", now + 0.3);
          synth.triggerAttackRelease("C6", "4n", now + 0.45);
        }
      } catch (e) {}
    }
  </script>

        level: "高層次思考",
        badge: "土地利用",
        text: "林口和臺中大肚山頂部平坦，原本取水不易，現代已發展成繁華新市鎮或科學園區，它們是？",
        options: ["平原", "台地", "盆地", "深山"],
        correct: 1,
        explain: "林口台地、大肚台地因頂部平整寬闊，現代克服水利後大量開發聚落。"

  <script>
    // 遊戲物理與 Canvas 狀態
    const canvas = document.getElementById('tugCanvas');
    const ctx = canvas.getContext('2d');

    // 遊戲狀態變數
    let ropePosition = 0; // 0 為中線；-100 為藍方勝；+100 為紅方勝
    let targetRopePos = 0; // 平滑插值目標
    let particles = [];
    let isGameOver = false;

    // 玩家進度
    let p1Index = 0;
    let p1Score = 0;
    let p1Streak = 0;

    let p2Index = 0;
    let p2Score = 0;
    let p2Streak = 0;

    // 調整 Canvas 解析度與響應式
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);

    // 粒子類別（答對回饋爆發）
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 2;
        this.size = Math.random() * 6 + 3;
        this.alpha = 1;
        this.life = 0.94;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.18; // 重力
        this.alpha *= this.life;
        this.size *= 0.96;
      }
      draw(c) {
        c.save();
        c.globalAlpha = Math.max(0, this.alpha);
        c.fillStyle = this.color;
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 28; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    // 繪製小人隊員
    function drawTugPlayer(c, x, y, isLeft, color, pullPower) {
      c.save();
      c.translate(x, y);

      // 向後傾斜角度（拉力越強傾斜越大）
      const lean = isLeft ? -0.28 - pullPower * 0.15 : 0.28 + pullPower * 0.15;
      c.rotate(lean);

      // 身體
      c.fillStyle = color;
      c.beginPath();
      c.roundRect(-10, -28, 20, 32, 6);
      c.fill();

      // 頭部
      c.fillStyle = '#ffdfba';
      c.beginPath();
      c.arc(0, -42, 11, 0, Math.PI * 2);
      c.fill();

      // 頭帶
      c.fillStyle = isLeft ? '#06b6d4' : '#f43f5e';
      c.fillRect(-10, -48, 20, 5);

      // 眼睛
      c.fillStyle = '#1e293b';
      const eyeOffset = isLeft ? -3 : 3;
      c.beginPath();
      c.arc(eyeOffset, -42, 2, 0, Math.PI * 2);
      c.fill();

      // 手臂（抓住繩子）
      c.strokeStyle = '#ffdfba';
      c.lineWidth = 5;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(-6, -20);
      c.lineTo(isLeft ? 14 : -14, -8);
      c.stroke();

      // 雙腳
      c.strokeStyle = '#334155';
      c.lineWidth = 6;
      c.beginPath();
      c.moveTo(-6, 4);
      c.lineTo(-12, 24);
      c.moveTo(6, 4);
      c.lineTo(isLeft ? -2 : 14, 24);
      c.stroke();

      c.restore();
    }
  </script>

  <script>
    let animTime = 0;

    function renderTugGame() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      ctx.clearRect(0, 0, w, h);
      animTime += 0.05;

      // 平滑拉鋸位移計算
      ropePosition += (targetRopePos - ropePosition) * 0.08;

      // 1. 繪製背景操場地面
      const groundY = h * 0.76;
      const gradient = ctx.createLinearGradient(0, groundY - 20, 0, h);
      gradient.addColorStop(0, '#1e293b');
      gradient.addColorStop(1, '#0f172a');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, groundY, w, h - groundY);

      // 操場跑道線
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(0, groundY + 12);
      ctx.lineTo(w, groundY + 12);
      ctx.stroke();
      ctx.setLineDash([]);

      // 2. 拔河決勝界線標示
      const centerX = w / 2;
      const winDist = w * 0.28; // 超過此距離即判定拔河大勝

      // 中線與左右警戒線
      ctx.lineWidth = 3;
      // 藍方勝線
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
      ctx.beginPath();
      ctx.moveTo(centerX - winDist, groundY - 30);
      ctx.lineTo(centerX - winDist, groundY + 30);
      ctx.stroke();

      // 紅方勝線
      ctx.strokeStyle = 'rgba(244, 63, 94, 0.4)';
      ctx.beginPath();
      ctx.moveTo(centerX + winDist, groundY - 30);
      ctx.lineTo(centerX + winDist, groundY + 30);
      ctx.stroke();

      // 中央基準白線
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(centerX, groundY - 40);
      ctx.lineTo(centerX, groundY + 25);
      ctx.stroke();

      // 3. 繪製拔河繩
      // 繩子實際中心 X 座標隨 ropePosition 位移
      const ropeOffsetPix = (ropePosition / 100) * winDist;
      const currentRopeCenterX = centerX + ropeOffsetPix;
      const ropeY = groundY - 14;

      // 繩子自然緊繃微顫動
      const wobble = Math.sin(animTime * 12) * 1.5;

      ctx.save();
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(20, ropeY + wobble * 0.5);
      ctx.lineTo(w - 20, ropeY - wobble * 0.5);
      ctx.stroke();

      // 繩子紋路質感
      ctx.strokeStyle = '#b45309';
      ctx.lineWidth = 3;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(20, ropeY);
      ctx.lineTo(w - 20, ropeY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      // 4. 繩子中央紅絲帶 (標的物)
      ctx.save();
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#dc2626';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(currentRopeCenterX, ropeY, 9, 0, Math.PI * 2);
      ctx.fill();

      // 紅色彩帶飄帶
      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(currentRopeCenterX, ropeY + 4);
      ctx.quadraticCurveTo(currentRopeCenterX + Math.sin(animTime * 8) * 8, ropeY + 22, currentRopeCenterX + Math.cos(animTime * 6) * 10, ropeY + 36);
      ctx.stroke();
      ctx.restore();

      // 5. 繪製藍隊拔河隊員（3人小隊）
      const leftPull = targetRopePos < ropePosition ? 1 : 0.2;
      const rightPull = targetRopePos > ropePosition ? 1 : 0.2;

      for (let i = 0; i < 3; i++) {
        const px = currentRopeCenterX - 65 - (i * 38);
        drawTugPlayer(ctx, px, ropeY + 12, true, '#0284c7', leftPull);
      }

      // 6. 繪製紅隊拔河隊員（3人小隊）
      for (let i = 0; i < 3; i++) {
        const px = currentRopeCenterX + 65 + (i * 38);
        drawTugPlayer(ctx, px, ropeY + 12, false, '#e11d48', rightPull);
      }

      // 7. 更新並繪製爆炸回饋粒子
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.alpha <= 0.05) {
          particles.splice(i, 1);
        }
      }

      // 循環繪製
      requestAnimationFrame(renderTugGame);
    }
  </script>

  <script>
    // DOM 節點引用
    const p1QuestionText = document.getElementById('p1QuestionText');
    const p1OptionsContainer = document.getElementById('p1OptionsContainer');
    const p1ProgressText = document.getElementById('p1ProgressText');
    const p1DifficultyBadge = document.getElementById('p1DifficultyBadge');
    const p1ScoreBadge = document.getElementById('p1ScoreBadge');
    const p1StreakElem = document.getElementById('p1Streak');
    const p1FeedbackAnimation = document.getElementById('p1FeedbackAnimation');

    const p2QuestionText = document.getElementById('p2QuestionText');
    const p2OptionsContainer = document.getElementById('p2OptionsContainer');
    const p2ProgressText = document.getElementById('p2ProgressText');
    const p2DifficultyBadge = document.getElementById('p2DifficultyBadge');
    const p2ScoreBadge = document.getElementById('p2ScoreBadge');
    const p2StreakElem = document.getElementById('p2Streak');
    const p2FeedbackAnimation = document.getElementById('p2FeedbackAnimation');

    const matchTension = document.getElementById('matchTension');
    const victoryModal = document.getElementById('victoryModal');
    const winnerTitle = document.getElementById('winnerTitle');
    const winnerDesc = document.getElementById('winnerDesc');
    const finalP1Score = document.getElementById('finalP1Score');
    const finalP2Score = document.getElementById('finalP2Score');
    const modalRestartBtn = document.getElementById('modalRestartBtn');
    const resetGameBtn = document.getElementById('resetGameBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundText = document.getElementById('soundText');

    // 渲染 P1 (藍隊) 當前題目
    function renderP1Question() {
      if (p1Index >= questionsP1.length) {
        p1QuestionText.innerHTML = "🎉 藍隊已完成全部 10 題！等待賽局結束！";
        p1OptionsContainer.innerHTML = `<div class="col-span-2 text-center py-6 text-sm text-cyan-400 font-bold bg-slate-900/60 rounded-xl border border-cyan-800">全部答題完成！防守中！</div>`;
        checkGameCompletion();
        return;
      }

      const q = questionsP1[p1Index];
      p1ProgressText.textContent = `第 ${p1Index + 1} / 10 題`;
      p1DifficultyBadge.textContent = q.badge;
      p1QuestionText.textContent = q.text;
      p1OptionsContainer.innerHTML = '';

      q.options.forEach((optText, optIdx) => {
        const btn = document.createElement('button');
        btn.className = `option-btn w-full p-2.5 sm:p-3 text-left font-bold text-xs sm:text-sm rounded-xl bg-slate-700/80 hover:bg-cyan-700 text-slate-100 hover:text-white border border-slate-600 hover:border-cyan-400 shadow transition flex items-center gap-2`;
        btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-slate-900/80 text-cyan-300 border border-cyan-600/50 flex items-center justify-center text-xs flex-shrink-0">${optIdx + 1}</span><span>${optText}</span>`;
        btn.onclick = () => handleP1Answer(optIdx, btn);
        p1OptionsContainer.appendChild(btn);
      });
    }

    // 渲染 P2 (紅隊) 當前題目
    function renderP2Question() {
      if (p2Index >= questionsP2.length) {
        p2QuestionText.innerHTML = "🎉 紅隊已完成全部 10 題！等待賽局結束！";
        p2OptionsContainer.innerHTML = `<div class="col-span-2 text-center py-6 text-sm text-rose-400 font-bold bg-slate-900/60 rounded-xl border border-rose-800">全部答題完成！防守中！</div>`;
        checkGameCompletion();
        return;
      }

      const q = questionsP2[p2Index];
      p2ProgressText.textContent = `第 ${p2Index + 1} / 10 題`;
      p2DifficultyBadge.textContent = q.badge;
      p2QuestionText.textContent = q.text;
      p2OptionsContainer.innerHTML = '';

      q.options.forEach((optText, optIdx) => {
        const btn = document.createElement('button');
        btn.className = `option-btn w-full p-2.5 sm:p-3 text-left font-bold text-xs sm:text-sm rounded-xl bg-slate-700/80 hover:bg-rose-700 text-slate-100 hover:text-white border border-slate-600 hover:border-rose-400 shadow transition flex items-center gap-2`;
        btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-slate-900/80 text-rose-300 border border-rose-600/50 flex items-center justify-center text-xs flex-shrink-0">${optIdx + 1}</span><span>${optText}</span>`;
        btn.onclick = () => handleP2Answer(optIdx, btn);
        p2OptionsContainer.appendChild(btn);
      });
    }

    // 處理 P1 作答
    function handleP1Answer(chosenIdx, clickedBtn) {
      if (isGameOver || p1Index >= questionsP1.length) return;
      const q = questionsP1[p1Index];
      const allBtns = p1OptionsContainer.querySelectorAll('button');
      allBtns.forEach(b => b.disabled = true);

      if (chosenIdx === q.correct) {
        // 答對
        playCorrectSound();
        playPullSound();
        p1Score++;
        p1Streak++;
        p1ScoreBadge.textContent = `${p1Score * 10} 分`;
        p1StreakElem.textContent = `連對 ${p1Streak} 題 🔥`;
        
        // 繩子往左拉 (負值方向)
        const pullPower = 10 + (p1Streak > 2 ? 4 : 0);
        targetRopePos = Math.max(-100, targetRopePos - pullPower);

        // 視覺爆發粒子特效在左方隊伍
        const rect = canvas.getBoundingClientRect();
        createExplosion(rect.width * 0.35, rect.height * 0.7, '#38bdf8');

        // 按鈕綠色反饋
        clickedBtn.classList.remove('bg-slate-700/80', 'hover:bg-cyan-700');
        clickedBtn.classList.add('bg-emerald-600', 'border-emerald-300', 'text-white');

        showFloatingFeedback(p1FeedbackAnimation, "✨ 答對了！強力向左拉！", "text-cyan-300");
      } else {
        // 答錯
        playWrongSound();
        p1Streak = 0;
        p1StreakElem.textContent = `連對 0 題`;
        // 答錯繩子稍往對方滑移
        targetRopePos = Math.min(100, targetRopePos + 3);

        clickedBtn.classList.remove('bg-slate-700/80');
        clickedBtn.classList.add('bg-rose-700', 'border-rose-400');
        showFloatingFeedback(p1FeedbackAnimation, `❌ 答錯囉！答案是：${q.options[q.correct]}`, "text-rose-400");
      }

      updateTensionDisplay();

      // 檢查是否已觸發直接拔河勝利 (拉過臨界點)
      if (targetRopePos <= -85) {
        setTimeout(() => triggerVictory("p1_pull"), 500);
        return;
      }

      setTimeout(() => {
        p1Index++;
        renderP1Question();
      }, 900);
    }

    // 處理 P2 作答
    function handleP2Answer(chosenIdx, clickedBtn) {
      if (isGameOver || p2Index >= questionsP2.length) return;
      const q = questionsP2[p2Index];
      const allBtns = p2OptionsContainer.querySelectorAll('button');
      allBtns.forEach(b => b.disabled = true);

      if (chosenIdx === q.correct) {
        // 答對
        playCorrectSound();
        playPullSound();
        p2Score++;
        p2Streak++;
        p2ScoreBadge.textContent = `${p2Score * 10} 分`;
        p2StreakElem.textContent = `連對 ${p2Streak} 題 🔥`;

        // 繩子往右拉 (正值方向)
        const pullPower = 10 + (p2Streak > 2 ? 4 : 0);
        targetRopePos = Math.min(100, targetRopePos + pullPower);

        // 視覺爆發粒子特效在右方隊伍
        const rect = canvas.getBoundingClientRect();
        createExplosion(rect.width * 0.65, rect.height * 0.7, '#fb7185');

        // 按鈕綠色反饋
        clickedBtn.classList.remove('bg-slate-700/80', 'hover:bg-rose-700');
        clickedBtn.classList.add('bg-emerald-600', 'border-emerald-300', 'text-white');

        showFloatingFeedback(p2FeedbackAnimation, "✨ 答對了！全力向右拉！", "text-rose-300");
      } else {
        // 答錯
        playWrongSound();
        p2Streak = 0;
        p2StreakElem.textContent = `連對 0 題`;
        // 答錯繩子稍往藍隊滑移
        targetRopePos = Math.max(-100, targetRopePos - 3);

        clickedBtn.classList.remove('bg-slate-700/80');
        clickedBtn.classList.add('bg-rose-700', 'border-rose-400');
        showFloatingFeedback(p2FeedbackAnimation, `❌ 答錯囉！答案是：${q.options[q.correct]}`, "text-rose-400");
      }

      updateTensionDisplay();

      // 檢查是否已觸發直接拔河勝利 (拉過臨界點)
      if (targetRopePos >= 85) {
        setTimeout(() => triggerVictory("p2_pull"), 500);
        return;
      }

      setTimeout(() => {
        p2Index++;
        renderP2Question();
      }, 900);
    }

    // 顯示卡片文字回饋
    function showFloatingFeedback(elem, text, colorClass) {
      elem.textContent = text;
      elem.className = `absolute inset-0 bg-slate-950/85 pointer-events-none transition-opacity duration-200 flex items-center justify-center text-center p-3 text-sm sm:text-base font-black ${colorClass} opacity-100 z-20`;
      setTimeout(() => {
        elem.classList.remove('opacity-100');
        elem.classList.add('opacity-0');
      }, 750);
    }

    // 更新拔河標線文字說明
    function updateTensionDisplay() {
      if (targetRopePos < -45) {
        matchTension.innerHTML = `<span class="text-cyan-400 font-bold">⚡ 藍隊大幅領先！</span>`;
      } else if (targetRopePos > 45) {
        matchTension.innerHTML = `<span class="text-rose-400 font-bold">⚡ 紅隊大幅領先！</span>`;
      } else {
        matchTension.innerHTML = `<span>雙方僵持不下</span>`;
      }
    }

    // 檢查雙方是否都已完成 10 題
    function checkGameCompletion() {
      if (p1Index >= questionsP1.length && p2Index >= questionsP2.length) {
        setTimeout(() => {
          if (targetRopePos < -5) {
            triggerVictory("p1");
          } else if (targetRopePos > 5) {
            triggerVictory("p2");
          } else {
            // 平手或看分數
            if (p1Score > p2Score) triggerVictory("p1");
            else if (p2Score > p1Score) triggerVictory("p2");
            else triggerVictory("draw");
          }
        }, 800);
      }
    }

    // 觸發結算勝利彈窗
    function triggerVictory(winnerCode) {
      if (isGameOver) return;
      isGameOver = true;
      playVictoryFanfare();

      finalP1Score.textContent = `${p1Score} / 10 題 (${p1Score * 10} 分)`;
      finalP2Score.textContent = `${p2Score} / 10 題 (${p2Score * 10} 分)`;

      if (winnerCode === 'p1' || winnerCode === 'p1_pull') {
        winnerTitle.textContent = "🏆 藍隊勇奪勝利！力拔山河！";
        winnerTitle.className = "text-2xl sm:text-3xl font-black text-cyan-400 mb-1";
        winnerDesc.textContent = "恭喜藍隊！憑藉出色的五大地形知識，將紅隊完全拉入陣地！";
      } else if (winnerCode === 'p2' || winnerCode === 'p2_pull') {
        winnerTitle.textContent = "🏆 紅隊勇奪勝利！勢不可擋！";
        winnerTitle.className = "text-2xl sm:text-3xl font-black text-rose-400 mb-1";
        winnerDesc.textContent = "恭喜紅隊！熟練掌握平原、盆地、台地、丘陵與山地，贏得拔河王！";
      } else {
        winnerTitle.textContent = "🤝 勢均力敵！雙方平手！";
        winnerTitle.className = "text-2xl sm:text-3xl font-black text-amber-300 mb-1";
        winnerDesc.textContent = "兩位都是地形知識大師，實力不分軒輊！";
      }

      victoryModal.classList.remove('hidden');
      victoryModal.classList.add('flex');
    }

    // 重新開始遊戲
    function resetGame() {
      isGameOver = false;
      ropePosition = 0;
      targetRopePos = 0;
      particles = [];

      p1Index = 0;
      p1Score = 0;
      p1Streak = 0;
      p1ScoreBadge.textContent = "0 分";
      p1StreakElem.textContent = "連對 0 題";

      p2Index = 0;
      p2Score = 0;
      p2Streak = 0;
      p2ScoreBadge.textContent = "0 分";
      p2StreakElem.textContent = "連對 0 題";

      victoryModal.classList.add('hidden');
      victoryModal.classList.remove('flex');
      matchTension.textContent = "拔河拉鋸中";

      renderP1Question();
      renderP2Question();
    }

    // 音效開關按鈕
    soundToggleBtn.onclick = () => {
      soundEnabled = !soundEnabled;
      soundIcon.textContent = soundEnabled ? "🔊" : "🔇";
      soundText.textContent = soundEnabled ? "音效開" : "靜音";
      if (soundEnabled) initAudio();
    };

    resetGameBtn.onclick = resetGame;
    modalRestartBtn.onclick = resetGame;

    // 初始化啟動
    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      renderP1Question();
      renderP2Question();
      requestAnimationFrame(renderTugGame);
    });
  </script>
